[project]
name = "textadventure-daisy"
version = "0.1.0"
description = "Das Abenteuer des Rache-Dackels"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.16"]

[project.gui-scripts]
daisy-gui = "daisy.ui:main"

[tool.setuptools.packages.find]
include = ["daisy*"]

[tool.setuptools.package-data]
daisy = ["assets/*.png", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "SIM", "TRY", "UP"]
ignore = ["TRY003"]
