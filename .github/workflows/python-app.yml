name: Python tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install ".[dev]"
      - name: Check code quality
        run: |
          ruff check daisy tests run_game.py
          ruff format --check daisy tests run_game.py
      - name: Compile application
        run: python -m compileall -q daisy run_game.py
      - name: Run tests
        run: python -m pytest
